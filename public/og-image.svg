<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Logo/Icon -->
  <g transform="translate(100, 150)">
    <rect width="120" height="120" rx="24" fill="#FFFFFF" opacity="0.2"/>
    <path d="M40 40 L40 75 Q40 95 60 95 Q80 95 80 75 L80 40"
          stroke="#FFFFFF"
          stroke-width="10"
          fill="none"
          stroke-linecap="round"/>
    <circle cx="60" cy="97" r="4" fill="#10B981"/>
  </g>

  <!-- Title -->
  <text x="100" y="350" font-family="system-ui, sans-serif" font-size="72" font-weight="bold" fill="#FFFFFF">
    UniPark
  </text>

  <!-- Subtitle -->
  <text x="100" y="420" font-family="system-ui, sans-serif" font-size="36" fill="#FFFFFF" opacity="0.9">
    Автоматизация парковки без лишних усилий
  </text>

  <!-- Features -->
  <g transform="translate(100, 480)">
    <text font-family="system-ui, sans-serif" font-size="24" fill="#FFFFFF" opacity="0.8">
      ✓ Распознавание номеров   ✓ Гибкие тарифы   ✓ 24/7 Контроль
    </text>
  </g>
</svg>
